name: Release

on:
  workflow_dispatch:
    inputs:
      server:
        description: InfiniChat server release
        type: choice
        default: auto
        options: [auto, force, skip]
      mobile:
        description: Mobile iOS TestFlight release
        type: choice
        default: auto
        options: [auto, force, skip]
      mac:
        description: Mac desktop release
        type: choice
        default: auto
        options: [auto, force, skip]
      server_bump:
        description: Server semver bump (when server releases)
        type: choice
        default: patch
        options: [patch, minor, major]
      mac_bump:
        description: Mac semver bump (when Mac releases)
        type: choice
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: Preview what would release without committing or publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      server: ${{ steps.plan.outputs.server }}
      mobile: ${{ steps.plan.outputs.mobile }}
      mac: ${{ steps.plan.outputs.mac }}
      server_version: ${{ steps.plan.outputs.server_version }}
      mobile_build: ${{ steps.plan.outputs.mobile_build }}
      mac_version: ${{ steps.plan.outputs.mac_version }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
      - id: plan
        name: Compute release plan
        env:
          RELEASE_SERVER: ${{ inputs.server }}
          RELEASE_MOBILE: ${{ inputs.mobile }}
          RELEASE_MAC: ${{ inputs.mac }}
          RELEASE_SERVER_BUMP: ${{ inputs.server_bump }}
          RELEASE_MAC_BUMP: ${{ inputs.mac_bump }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/release-plan.mjs --dry-run
          else
            node scripts/release-plan.mjs --apply
          fi

  release-server:
    name: Release server v${{ needs.plan.outputs.server_version }}
    needs: [plan]
    if: ${{ !inputs.dry_run && needs.plan.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify packages/infinichat and packages/infinichat-server
        run: |
          pnpm --filter @pi-agent/infinichat lint
          (cd packages/infinichat && bun test test)
          pnpm --filter @pi-agent/infinichat-server check
          pnpm --filter @pi-agent/infinichat-server typecheck
          pnpm --filter @pi-agent/infinichat-server lint
      - name: Publish server GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @pi-agent/infinichat-server release

  release-mobile:
    name: Release iOS build ${{ needs.plan.outputs.mobile_build }}
    needs: [plan, release-server]
    if: ${{ always() && !inputs.dry_run && needs.plan.outputs.mobile == 'true' && (needs.release-server.result == 'success' || needs.release-server.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not configured in repository settings."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and lint mobile app
        working-directory: apps/mobile
        run: |
          npx tsc --noEmit
          pnpm run lint
      - name: Build and submit iOS to TestFlight via EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build -p ios --profile production --auto-submit --non-interactive --wait
      - name: Tag mobile build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="mobile/b${{ needs.plan.outputs.mobile_build }}"
          git tag -a "$tag" "${{ needs.plan.outputs.release_sha }}" -m "InfiniChat iOS build ${{ needs.plan.outputs.mobile_build }}"
          git push origin "$tag"

  release-mac:
    name: Release Mac v${{ needs.plan.outputs.mac_version }}
    needs: [plan, release-server]
    if: ${{ always() && !inputs.dry_run && needs.plan.outputs.mac == 'true' && (needs.release-server.result == 'success' || needs.release-server.result == 'skipped') }}
    runs-on: macos-26
    steps:
      - name: Verify Apple signing & notarization secrets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=()
          for var in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!var}" ] || missing+=("$var")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Mac release secret(s): ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Install Hutch 0.28.2
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- 0.28.2
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Import Developer ID certificate and ASC API key
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$CERT_PATH" "$KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "ELECTROBUN_APPLEAPIKEYPATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare, typecheck, and lint Mac app
        working-directory: apps/mac
        run: |
          hutch electrobun prepare
          pnpm run typecheck
          pnpm run lint
      - name: Build, sign, notarize, and publish Mac GitHub release
        working-directory: apps/mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.APPLE_API_KEY_ID }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: hutch scripts/release.ts
      - name: Clean up signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
