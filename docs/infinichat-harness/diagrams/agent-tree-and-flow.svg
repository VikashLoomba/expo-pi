<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 13px; fill: #475569; }
      .sec { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
      .box-title { font-size: 13px; font-weight: 700; fill: #0F172A; }
      .small { font-size: 10.5px; fill: #475569; }
      .code { font-size: 10.4px; fill: #0F172A; }
      .badge { font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; }
    </style>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4338CA"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1158" height="658" rx="14" fill="#FAFAF8" stroke="#E2E0D8" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="38" class="sans title">The Tree of Lasting Agents Inside One Harness</text>
  <text x="32" y="58" class="sans subtitle">Every agent owns a durable conversation and memory tree; agents talk strictly parent ↔ child via atomic tell() commits.</text>

  <!-- LEFT MAIN AREA: Agent Tree Diagram -->
  <rect x="32" y="78" width="690" height="552" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <rect x="32" y="78" width="690" height="28" rx="10" fill="#F1F5F9"/>
  <rect x="32" y="94" width="690" height="12" fill="#F1F5F9"/>
  <text x="48" y="97" class="sans sec" style="fill: #334155;">TREE TOPOLOGY, OWNERSHIP &amp; MESSAGE FLOW (optchat.tree IN ROOT)</text>

  <!-- USER NODE -->
  <rect x="256" y="120" width="242" height="44" rx="22" fill="#0F172A"/>
  <text x="377" y="139" text-anchor="middle" class="sans box-title" style="fill: #FFFFFF;">User (iPhone &amp; Mac UI)</text>
  <text x="377" y="155" text-anchor="middle" class="sans small" style="fill: #CBD5E1;">Reads any chat · Talks only to root</text>

  <!-- Arrow User <-> Root -->
  <line x1="336" y1="164" x2="336" y2="210" stroke="#4338CA" stroke-width="1.8" marker-end="url(#arr-indigo)"/>
  <text x="324" y="185" text-anchor="end" class="mono code" style="fill: #3730A3;">accept() → user</text>
  <text x="324" y="200" text-anchor="end" class="sans small">admits to root</text>

  <line x1="418" y1="210" x2="418" y2="164" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <text x="430" y="185" class="mono code" style="fill: #0F766E;">tell("user", msg)</text>
  <text x="430" y="200" class="sans small">UI renders as reply</text>

  <!-- ROOT AGENT -->
  <rect x="200" y="212" width="354" height="96" rx="10" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/>
  <text x="216" y="233" class="sans box-title" style="fill: #312E81;">root</text>
  <rect x="480" y="219" width="60" height="18" rx="9" fill="#DCFCE7" stroke="#4ADE80"/>
  <text x="510" y="232" text-anchor="middle" class="sans badge" style="fill: #166534;">AWAKE</text>
  <text x="216" y="252" class="sans small">Conversation: <tspan class="mono">ROOT_CONVERSATION_ID</tspan> · cwd: <tspan class="mono">main</tspan></text>
  <text x="216" y="268" class="sans small">Docs: <tspan class="mono">TreeDoc</tspan>, <tspan class="mono">ConfigDoc</tspan>, <tspan class="mono">MemoryUsageDoc</tspan></text>
  <text x="216" y="284" class="sans small">Own memory tree + own model + <tspan class="mono">optchat.master</tspan></text>
  <text x="216" y="300" class="sans small" style="fill: #4338CA;"><tspan font-weight="700">Self-reply loop:</tspan> assistant text → own <tspan class="mono">infinichat</tspan> log only</text>

  <!-- Self-reply curved loop on root -->
  <path d="M 554 242 C 598 230 598 290 554 280" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-slate)"/>
  <text x="594" y="258" class="mono small" style="fill: #475569;">private</text>
  <text x="594" y="272" class="mono small" style="fill: #475569;">notes</text>

  <!-- Edges from root to 3 children -->
  <line x1="296" y1="308" x2="176" y2="386" stroke="#4338CA" stroke-width="1.7" marker-start="url(#arr-indigo)" marker-end="url(#arr-indigo)"/>
  <rect x="150" y="330" width="128" height="22" rx="11" fill="#F0FDFA" stroke="#0D9488"/>
  <text x="214" y="345" text-anchor="middle" class="mono badge" style="fill: #115E59;">bg AgentAnchor</text>

  <line x1="396" y1="308" x2="412" y2="386" stroke="#4338CA" stroke-width="1.7" marker-start="url(#arr-indigo)" marker-end="url(#arr-indigo)"/>
  <rect x="344" y="330" width="128" height="22" rx="11" fill="#F0FDFA" stroke="#0D9488"/>
  <text x="408" y="345" text-anchor="middle" class="mono badge" style="fill: #115E59;">bg AgentAnchor</text>

  <line x1="482" y1="308" x2="606" y2="386" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-slate)"/>
  <text x="564" y="344" class="sans small" style="fill: #64748B;">hidden</text>

  <!-- Child 1 box: research -->
  <rect x="48" y="388" width="222" height="92" rx="9" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="60" y="408" class="sans box-title">research</text>
  <rect x="198" y="394" width="60" height="18" rx="9" fill="#DCFCE7" stroke="#4ADE80"/>
  <text x="228" y="407" text-anchor="middle" class="sans badge" style="fill: #166534;">AWAKE</text>
  <text x="60" y="426" class="sans small">cwd: <tspan class="mono">&lt;work&gt;/research</tspan></text>
  <text x="60" y="442" class="sans small">Own model, own memory tree</text>
  <text x="60" y="458" class="sans small">Down: <tspan class="mono">user</tspan> · Up: <tspan class="mono">work [research]</tspan></text>
  <text x="60" y="472" class="sans small">Survives parent <tspan class="mono">abort()</tspan></text>

  <!-- Forbidden sibling edge -->
  <line x1="270" y1="434" x2="314" y2="434" stroke="#BE123C" stroke-width="1.6" stroke-dasharray="3 2"/>
  <circle cx="292" cy="434" r="9" fill="#FFE4E6" stroke="#BE123C" stroke-width="1.2"/>
  <text x="292" y="438" text-anchor="middle" class="sans badge" style="fill: #BE123C;">✕</text>
  <text x="292" y="497" text-anchor="middle" class="sans small" style="fill: #9F1239; font-size: 9.8px;">No sibling tell</text>

  <!-- Child 2 box: ops -->
  <rect x="314" y="388" width="204" height="92" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="326" y="408" class="sans box-title">ops</text>
  <rect x="444" y="394" width="62" height="18" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="475" y="407" text-anchor="middle" class="sans badge" style="fill: #475569;">ASLEEP</text>
  <text x="326" y="426" class="sans small">cwd: <tspan class="mono">&lt;work&gt;/ops</tspan></text>
  <text x="326" y="442" class="sans small">Own model (e.g. faster model)</text>
  <text x="326" y="458" class="sans small"><tspan class="mono">CoordinatorDoc.task = null</tspan></text>
  <text x="326" y="472" class="sans small">No <tspan class="mono">optchat.master</tspan> tools</text>

  <!-- Child 3 box: archive (hidden) -->
  <rect x="534" y="388" width="172" height="92" rx="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="546" y="408" class="sans box-title" style="fill: #64748B;">archive</text>
  <rect x="632" y="394" width="62" height="18" rx="9" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="663" y="407" text-anchor="middle" class="sans badge" style="fill: #92400E;">HIDDEN</text>
  <text x="546" y="426" class="sans small">Omitted from <tspan class="mono">place()</tspan></text>
  <text x="546" y="442" class="sans small">&amp; UI <tspan class="mono">AgentList</tspan>.</text>
  <text x="546" y="458" class="sans small">Chat &amp; folder persist;</text>
  <text x="546" y="472" class="sans small"><tspan class="mono">tell</tspan> &amp; <tspan class="mono">show</tspan> still work.</text>

  <!-- Grandchild under research -->
  <line x1="159" y1="480" x2="159" y2="526" stroke="#4338CA" stroke-width="1.6" marker-start="url(#arr-indigo)" marker-end="url(#arr-indigo)"/>
  <text x="169" y="508" class="mono small" style="fill: #3730A3;">spawn / tell</text>

  <rect x="48" y="528" width="222" height="84" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="60" y="548" class="sans box-title">benchmarks</text>
  <rect x="196" y="534" width="62" height="18" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="227" y="547" text-anchor="middle" class="sans badge" style="fill: #475569;">ASLEEP</text>
  <text x="60" y="566" class="sans small">Parent: <tspan class="mono">research</tspan> (never talks to root)</text>
  <text x="60" y="582" class="sans small">cwd: <tspan class="mono">&lt;work&gt;/benchmarks</tspan></text>
  <text x="60" y="598" class="sans small">Same prompt &amp; zoomable memory</text>

  <!-- Place injection callout -->
  <rect x="304" y="520" width="402" height="92" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="316" y="538" class="sans badge" style="fill: #92400E;">INJECTED INTO EVERY FRESH TURN TAIL (placeOf)</text>
  <text x="316" y="556" class="mono code">You are root. Your parent: the user (tell "user").</text>
  <text x="316" y="572" class="mono code">Your children:</text>
  <text x="316" y="588" class="mono code">- research: deep dives &amp; papers (awake)</text>
  <text x="316" y="604" class="mono code">- ops: deployments &amp; servers   (1 hidden)</text>

  <!-- RIGHT PANEL: ATOMIC TRANSACTIONS -->
  <rect x="740" y="78" width="388" height="552" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <rect x="740" y="78" width="388" height="28" rx="10" fill="#CCFBF1"/>
  <rect x="740" y="94" width="388" height="12" fill="#CCFBF1"/>
  <text x="756" y="97" class="sans sec" style="fill: #115E59;">HOW PI-DURABLE MAKES IT ATOMIC</text>

  <!-- Box 1: Atomic Spawn -->
  <rect x="756" y="120" width="356" height="196" rx="8" fill="#F0FDFA" stroke="#2DD4BF"/>
  <text x="768" y="139" class="mono code" font-weight="700" style="fill: #115E59;">spawn({ name, description, task })</text>
  <text x="768" y="156" class="sans small" style="fill: #0F766E;">Single all-or-nothing commit (<tspan class="mono">callers: ['model']</tspan>):</text>
  <text x="768" y="175" class="sans small">1. Check <tspan class="mono">AgentCallDoc(api.taskId)</tspan> for replay safety</text>
  <text x="768" y="191" class="sans small">2. Validate <tspan class="mono">^[a-z0-9-]{1,16}$</tspan>, unique, ≠ user/main</text>
  <text x="768" y="207" class="sans small">3. Create bg <tspan class="mono">AgentAnchor</tspan> (ends immediately)</text>
  <text x="768" y="223" class="sans small">4. <tspan class="mono">tx.createConversation({ owner: anchor })</tspan></text>
  <text x="768" y="238" class="sans small">   → copies parent model &amp; extensions automatically</text>
  <text x="768" y="254" class="sans small">5. <tspan class="mono">configure({ cwd: name, remove: [master] })</tspan></text>
  <text x="768" y="270" class="sans small">6. Init child <tspan class="mono">MemoryDoc</tspan> &amp; <tspan class="mono">AppDoc</tspan>; update <tspan class="mono">TreeDoc</tspan></text>
  <text x="768" y="286" class="sans small">7. <tspan class="mono">admit()</tspan> initial task (<tspan class="mono">spawn:&lt;taskId&gt;</tspan>) &amp; wake child</text>
  <text x="768" y="304" class="sans small" style="fill: #115E59;">→ Result saved in <tspan class="mono">AgentCallDoc</tspan> so replays don't double-spawn.</text>

  <!-- Box 2: Atomic Tell -->
  <rect x="756" y="330" width="356" height="148" rx="8" fill="#EEF2FF" stroke="#818CF8"/>
  <text x="768" y="349" class="mono code" font-weight="700" style="fill: #3730A3;">tell({ name, message })</text>
  <text x="768" y="366" class="sans small" style="fill: #4338CA;">Cross-conversation commit (<tspan class="mono">callers: ['model']</tspan>):</text>
  <text x="768" y="385" class="sans small">• Verifies <tspan class="mono">name</tspan> is direct parent (or <tspan class="mono">"user"</tspan>) or child.</text>
  <text x="768" y="401" class="sans small">• Root → <tspan class="mono">"user"</tspan>: no admission needed; the tool call</text>
  <text x="768" y="416" class="sans small">  itself is projected by <tspan class="mono">InfiniChatView</tspan> as root's reply!</text>
  <text x="768" y="432" class="sans small">• Parent ↔ Child: calls <tspan class="mono">admit()</tspan> on target conversation</text>
  <text x="768" y="447" class="sans small">  with <tspan class="mono">requestId = tell:&lt;taskId&gt;</tspan> → wakes target</text>
  <text x="768" y="462" class="sans small">  coordinator or steers its active turn immediately.</text>

  <!-- Box 3: Async Non-Blocking Pattern -->
  <rect x="756" y="492" width="356" height="122" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="768" y="511" class="sans box-title">Never Block or Poll — End Turn &amp; Sleep</text>
  <text x="768" y="529" class="sans small">• Calling <tspan class="mono">tell(child, task)</tspan> returns <tspan class="mono">"Sent to child."</tspan> at once.</text>
  <text x="768" y="545" class="sans small">• Parent writes private wrap-up text (<tspan class="mono">infinichat</tspan>) and sleeps.</text>
  <text x="768" y="561" class="sans small">• Child works across arbitrary turns, tools, restarts, or</text>
  <text x="768" y="576" class="sans small">  device moves, even parking on <tspan class="mono">ask_user</tspan> for hours.</text>
  <text x="768" y="592" class="sans small">• When done, child calls <tspan class="mono">tell(parent, report)</tspan> → wakes</text>
  <text x="768" y="606" class="sans small">  parent's coordinator cleanly with <tspan class="mono">[child]
report</tspan>.</text>
</svg>
