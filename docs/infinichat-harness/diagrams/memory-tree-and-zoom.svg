  <rect x="278" y="81" width="16" height="16" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="302" y="93" class="sans small"><tspan font-weight="700" style="fill: #0369A1;">Built NodeDoc</tspan> (available for zoom / compact)</text>

  <rect x="556" y="81" width="16" height="16" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 2"/>
