  <text x="706" y="336" text-anchor="middle" class="mono node-txt" style="fill: #14532D;">6+1</text>
  <text x="706" y="349" text-anchor="middle" class="sans badge" style="fill: #166534;">main[2]</text>

  <rect x="759" y="320" width="74" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.2"/>
  <text x="796" y="336" text-anchor="middle" class="mono node-txt" style="fill: #14532D;">7+1</text>
  <text x="796" y="349" text-anchor="middle" class="sans badge" style="fill: #166534;">main[3]</text>

  <rect x="849" y="320" width="74" height="34" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.2"/>
  <text x="886" y="336" text-anchor="middle" class="mono node-txt" style="fill: #14532D;">8+1</text>
  <text x="886" y="349" text-anchor="middle" class="sans badge" style="fill: #166534;">main[4]</text>

  <rect x="939" y="320" width="74" height="34" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 2"/>
  <text x="976" y="336" text-anchor="middle" class="mono node-txt" style="fill: #92400E;">9+1</text>
  <text x="976" y="349" text-anchor="middle" class="sans badge" style="fill: #B45309;">building</text>

  <rect x="1029" y="320" width="74" height="34" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4" stroke-dasharray="4 2"/>
  <text x="1066" y="336" text-anchor="middle" class="mono node-txt" style="fill: #92400E;">10+1</text>
  <text x="1066" y="349" text-anchor="middle" class="sans badge" style="fill: #B45309;">pending</text>

  <!-- Frontier vertical divider between 8 and 9 -->
  <line x1="931" y1="306" x2="931" y2="452" stroke="#0F766E" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="782" y="440" width="166" height="22" rx="5" fill="#CCFBF1" stroke="#0F766E"/>
  <text x="865" y="455" text-anchor="middle" class="mono badge" style="fill: #115E59;">frontier = viewThrough = 9</text>

  <!-- MessageDoc row (0..10) -->
  <g>
    <rect x="129" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="166" y="401" text-anchor="middle" class="mono code" font-weight="700">#0</text>
    <text x="166" y="418" text-anchor="middle" class="mono small">user</text>

    <rect x="219" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="256" y="401" text-anchor="middle" class="mono code" font-weight="700">#1</text>
    <text x="256" y="418" text-anchor="middle" class="mono small">tool</text>

    <rect x="309" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="346" y="401" text-anchor="middle" class="mono code" font-weight="700">#2</text>
    <text x="346" y="418" text-anchor="middle" class="mono small">echo</text>

    <rect x="399" y="384" width="74" height="44" rx="6" fill="#FFF1F2" stroke="#BE123C" stroke-width="2"/>
    <text x="436" y="400" text-anchor="middle" class="mono code" font-weight="700" style="fill: #9F1239;">#3 user</text>
    <text x="436" y="417" text-anchor="middle" class="sans badge" style="fill: #BE123C;">+ [image]</text>

    <rect x="489" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="526" y="401" text-anchor="middle" class="mono code" font-weight="700">#4</text>
    <text x="526" y="418" text-anchor="middle" class="mono small">infinichat</text>

    <rect x="579" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="616" y="401" text-anchor="middle" class="mono code" font-weight="700">#5</text>
    <text x="616" y="418" text-anchor="middle" class="mono small">work</text>

    <rect x="669" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="706" y="401" text-anchor="middle" class="mono code" font-weight="700">#6</text>
    <text x="706" y="418" text-anchor="middle" class="mono small">tool</text>

    <rect x="759" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="796" y="401" text-anchor="middle" class="mono code" font-weight="700">#7</text>
    <text x="796" y="418" text-anchor="middle" class="mono small">echo</text>

    <rect x="849" y="384" width="74" height="44" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="886" y="401" text-anchor="middle" class="mono code" font-weight="700">#8</text>
    <text x="886" y="418" text-anchor="middle" class="mono small">infinichat</text>

    <rect x="939" y="384" width="74" height="44" rx="6" fill="#FFFBEB" stroke="#F59E0B"/>
    <text x="976" y="401" text-anchor="middle" class="mono code" font-weight="700">#9</text>
    <text x="976" y="418" text-anchor="middle" class="mono small">tool</text>

    <rect x="1029" y="384" width="74" height="44" rx="6" fill="#FFFBEB" stroke="#F59E0B"/>
    <text x="1066" y="401" text-anchor="middle" class="mono code" font-weight="700">#10</text>
    <text x="1066" y="418" text-anchor="middle" class="mono small">echo</text>
  </g>
  <rect x="990" y="440" width="114" height="22" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="1047" y="455" text-anchor="middle" class="mono badge" style="fill: #92400E;">nextMessage = 11</text>

  <!-- BOTTOM LEFT: Dual Hysteresis & BuildNode -->
  <rect x="32" y="490" width="548" height="238" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <rect x="32" y="490" width="548" height="28" rx="10" fill="#CCFBF1"/>
  <rect x="32" y="506" width="548" height="12" fill="#CCFBF1"/>
  <text x="48" y="509" class="sans sec" style="fill: #115E59;">HYSTERESIS VIEW BUDGETS &amp; SUMMARY PUMP</text>

  <rect x="48" y="532" width="250" height="90" rx="7" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="58" y="550" class="sans box-title" style="fill: #115E59;">main View (for Turns)</text>
  <text x="58" y="568" class="sans small">• Appends <tspan class="mono">[0, i]</tspan> as <tspan class="mono">frontier</tspan> advances</text>
  <text x="58" y="584" class="sans small">• Triggers reduction at <tspan font-weight="700">&gt; 128,000 B</tspan></text>
  <text x="58" y="600" class="sans small">• Batch-merges aligned pairs to <tspan font-weight="700">≤ 64,000 B</tspan></text>
  <text x="58" y="615" class="sans small">• Picks max <tspan class="mono">(T − last) / width</tspan> (<tspan class="mono">moreDue</tspan>)</text>

  <rect x="312" y="532" width="252" height="90" rx="7" fill="#F0F9FF" stroke="#7DD3FC"/>
  <text x="322" y="550" class="sans box-title" style="fill: #0369A1;">compact View (for BuildNode)</text>
  <text x="322" y="568" class="sans small">• Independent batching from <tspan class="mono">main</tspan></text>
  <text x="322" y="584" class="sans small">• Triggers reduction at <tspan font-weight="700">&gt; 32,000 B</tspan></text>
  <text x="322" y="600" class="sans small">• Batch-merges pairs to <tspan font-weight="700">≤ 16,000 B</tspan></text>
  <text x="322" y="615" class="sans small">• Leaves turn prompt cache untouched!</text>

  <rect x="48" y="634" width="516" height="82" rx="7" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="58" y="652" class="sans box-title">BuildNode Concurrency Pump (JOBS = 64)</text>
  <text x="58" y="669" class="sans small">• Starts ready leaves &amp; merges up to 64 unbuilt leaves deep, sorted by <tspan class="mono">ctx(ref)</tspan> (merges first on tie).</text>
  <text x="58" y="685" class="sans small">• Fast-path: source ≤ 512 B skips LLM. Over-limit outputs retry up to 5× with <tspan class="mono">| ← LIMIT</tspan> cut feedback.</text>
  <text x="58" y="701" class="sans small">• On publish: advances <tspan class="mono">frontier</tspan>, checks sibling to enqueue parent, rouses waiting coordinator, re-pumps.</text>

  <!-- BOTTOM RIGHT: Zoom & Date -->
  <rect x="596" y="490" width="532" height="238" rx="10" fill="#FFFFFF" stroke="#BE123C" stroke-width="1.3"/>
  <rect x="596" y="490" width="532" height="28" rx="10" fill="#FFE4E6"/>
  <rect x="596" y="506" width="532" height="12" fill="#FFE4E6"/>
  <text x="612" y="509" class="sans sec" style="fill: #9F1239;">HOW zoom(id, n, page) &amp; date(id) RECALL EXACT HISTORY</text>

  <rect x="612" y="532" width="500" height="124" rx="7" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="624" y="551" class="mono code" font-weight="700" style="fill: #9F1239;">1. zoom(0, 4)</text>
  <text x="726" y="551" class="sans small">→ Splits <tspan class="mono">[2,0]</tspan> into two half-width children: <tspan class="mono">0+2|...</tspan> and <tspan class="mono">2+2|...</tspan></text>

  <text x="624" y="575" class="mono code" font-weight="700" style="fill: #9F1239;">2. zoom(2, 2)</text>
  <text x="726" y="575" class="sans small">→ Splits <tspan class="mono">[1,1]</tspan> into leaves: <tspan class="mono">2+1|...</tspan> and <tspan class="mono">3+1|user: ... [image]</tspan></text>

  <text x="624" y="599" class="mono code" font-weight="700" style="fill: #9F1239;">3. zoom(3, 1)</text>
  <text x="726" y="599" class="sans small">→ Reads <tspan class="mono">MessageDoc("3")</tspan> verbatim: <tspan class="mono">3+0|user: &lt;full text&gt;</tspan></text>
  <text x="738" y="615" class="sans small">Paginated at <tspan class="mono">29,000</tspan> chars (<tspan class="mono">Page 1/K</tspan>); returns <tspan font-weight="700" style="fill: #9F1239;">original images on page 0</tspan>!</text>

  <text x="624" y="641" class="mono code" font-weight="700" style="fill: #475569;">Invalid id+n?</text>
  <text x="726" y="641" class="sans small">Returns canonical roots (here: <tspan class="mono">0+8, 8+2, 10+1</tspan>), never throws.</text>

  <rect x="612" y="666" width="500" height="50" rx="7" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="624" y="685" class="sans small"><tspan class="mono code" font-weight="700">date(id)</tspan>   Reads <tspan class="mono">MessageDoc(id).date</tspan> in local time (<tspan class="mono">YYYY-MM-DD HH:mm:ss</tspan>).</text>
  <text x="624" y="703" class="sans small">Because turn envelopes omit timestamps, <tspan class="mono">date(id)</tspan> gives time awareness without busting cache.</text>
</svg>
