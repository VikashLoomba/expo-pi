  <!-- Header -->
  <text x="32" y="38" class="sans title">Binary Memory Tree, Dual Hysteresis Views &amp; Lossless Zoom</text>
  <text x="32" y="58" class="sans subtitle">Example at nextMessage = 11, frontier = 9, viewThrough = 9: each node [level, index] summarizes 2^level messages in ≤ 512 UTF-8 bytes.</text>

